version: '3.9'
services:
  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    env_file: ./apps/web/.env.local
    depends_on:
      - api

  api:
    build: ./apps/api
    ports:
      - "4000:4000"
    env_file: ./apps/api/.env
    depends_on:
      - redis
      - rabbitmq

  ai:
    build: ./services/ai
    ports:
      - "8000:8000"
    env_file: ./services/ai/.env
    depends_on:
      - rabbitmq
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: pretalkme
      RABBITMQ_DEFAULT_PASS: secret_local

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
